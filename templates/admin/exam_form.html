{% extends 'base.html' %}
{% block title %}{{ 'Edit Exam' if exam else 'New Exam' }} — Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="{{ url_for('admin.exams') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h4 class="fw-bold mb-0">{{ 'Edit Exam' if exam else 'New Exam' }}</h4>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">

          <div class="row g-3">

            <div class="col-md-8">
              <label class="form-label">Exam Name</label>
              <input type="text" class="form-control" name="exam_name"
                     value="{{ exam.exam_name if exam else '' }}"
                     placeholder="e.g. MAD1 Project Viva — Level 1" required />
            </div>

            <div class="col-md-4">
              <label class="form-label">Course</label>
              <select class="form-select" name="course_id" required>
                <option value="">Select course</option>
                {% for c in courses %}
                <option value="{{ c.id }}"
                  {% if exam and exam.course_id == c.id %}selected{% endif %}>
                  {{ c.course_code }} — {{ c.course_name }}
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Type</label>
              <select class="form-select" name="exam_type">
                {% for t in ['Viva', 'Practical', 'Project Demo', 'Assessment'] %}
                <option value="{{ t }}" {% if exam and exam.exam_type == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Duration (minutes)</label>
              <input type="number" class="form-control" name="duration"
                     value="{{ exam.duration if exam else 30 }}" min="5" required />
            </div>

            <div class="col-md-4">
              <label class="form-label">Max Marks</label>
              <input type="number" class="form-control" name="max_marks"
                     value="{{ exam.max_marks if exam else 100 }}" min="1" required />
            </div>

          </div>

          <hr class="my-4" />
          <p class="fw-semibold mb-3">Timeline <span class="text-muted fw-normal small">(optional — can set later)</span></p>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Slot Creation Opens</label>
              <input type="datetime-local" class="form-control" name="slot_creation_start"
                     value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_start else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Slot Creation Closes</label>
              <input type="datetime-local" class="form-control" name="slot_creation_end"
                     value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_end else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Booking Opens</label>
              <input type="datetime-local" class="form-control" name="booking_start"
                     value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_start else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Booking Closes</label>
              <input type="datetime-local" class="form-control" name="booking_end"
                     value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_end else '' }}" />
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn emp-btn-primary">
              {{ 'Save Changes' if exam else 'Create Exam' }}
            </button>
            <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
