{% extends 'base.html' %}
{% block title %}My Profile — Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="fw-bold mb-0">
          <i class="bi bi-person-circle me-2 text-primary"></i>My Profile
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Email (read-only)</label>
            <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly disabled>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}" placeholder="e.g. +91 9876543210">
          </div>

          <hr class="my-4">
          <h6 class="fw-semibold text-muted mb-3">Change Password <small class="fw-normal text-muted">(leave blank to keep current)</small></h6>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="Min 6 characters">
          </div>

          <div class="mb-4">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password">
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
            <button type="submit" class="btn emp-btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
